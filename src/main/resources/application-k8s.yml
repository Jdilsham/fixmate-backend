spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

  flyway:
    enabled: true
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    mbeanregistry:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL}
  backend-base-url: ${APP_BACKEND_BASE_URL}

payhere:
  merchant-id: ${PAYHERE_MERCHANT_ID}
  merchant-secret: ${PAYHERE_MERCHANT_SECRET}
  checkout-url: ${PAYHERE_CHECKOUT_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    binders:
      tomcat:
        enabled: true
    tags:
      application: fixmate-backend
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

gcp:
  bucket:
    name: ${GCP_BUCKET_NAME}